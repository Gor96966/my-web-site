<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Գրանցում - GYM.AM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            /* Գեղեցիկ մութ ֆոն նկարով */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .reg-card {
            /* Ապակե էֆեկտ (Glassmorphism) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #ff4d4d;
            margin-bottom: 30px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 13px;
            font-weight: 300;
            padding-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ff4d4d;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ff4d4d, #b30000);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.4s;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 77, 77, 0.6);
            background: linear-gradient(45deg, #ff6666, #cc0000);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <h2>GYM AM</h2>
        
        <form action="/register" method="POST">
            <div class="input-group">
                <label>Անուն Ազգանուն</label>
                <input type="text" name="full_name" placeholder="Արամ Արամյան" required>
            </div>

            <div class="input-group">
                <label>Հեռախոսահամար</label>
                <input type="text" name="phone" placeholder="+374 __ __ __" required>
            </div>

            <div class="input-group">
                <label>Էլ. Փոստ (Email)</label>
                <input type="email" name="email" placeholder="example@mail.com" required>
            </div>

            <button type="submit">Գրանցվել</button>
        </form>

        <a href="index.html">Հետ</a>
    </div>

</body>
</html>
